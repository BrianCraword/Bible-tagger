# ── Bible Tagger — per-site settings ───────────────────────────────────
#
# Everything here is stored in THIS site's database (theme_settings), so a
# component update ships new DEFAULTS and SCHEMA only — a site that has
# edited a setting keeps its value through every update.
#
# SCHEMA DISCIPLINE: evolve additively. Never rename a key or remove one —
# stored per-site values are keyed to them. 2.0.0 adds two keys and
# changes no existing one. 2.2.0 adds the eleven colour keys at the end
# of this file and changes no existing one.
#
# The option names and values below are Blue Letter Bible's own, passed
# through to window.BLB.Tagger. See
# https://www.blueletterbible.org/webtools/BLB_ScriptTagger.cfm

# NB the key is `tagger_enabled`, not `enabled`. A theme setting literally
# named `enabled` sits alongside the theme record's OWN `enabled` flag in
# Discourse's admin payload, and 1.0.0 shipped installed with the setting
# reading false despite defaulting to true. Renamed so the two can never be
# confused again. If you are upgrading from 1.0.0, the old `enabled` value
# is orphaned and ignored.
#
# CHECK THIS FIRST. A stored `false` survives every component update, and
# a switched-off tagger looks exactly like a broken one. On 2026-08-30 this
# site was found storing false.
tagger_enabled:
  default: true
  description: >-
    Master switch. Off = the component does nothing at all: no script load,
    no scanning, no tagging. It still logs one line to the console saying
    it is off, so this state can never again be mistaken for a failure.

translation:
  default: "CSB"
  description: >-
    Bible version shown in the hover popup and used for the links into
    blueletterbible.org. BLB's own default is NKJV. Use BLB's abbreviations
    (CSB, NKJV, KJV, NASB, ESV, NIV, NLT...). If a version you enter is not
    one BLB serves, their script quietly falls back to its default — so if
    popups suddenly show the wrong translation, check this value first.

hyperlinks:
  default: "all"
  type: enum
  choices:
    - all
    - none
    - hover
  description: >-
    Which references become links. 'all' tags every reference including
    ones a member already linked; 'none' shows the popup on hover but adds
    no links; 'hover' links only the references it tags itself.

target_new_window:
  default: true
  description: >-
    Open blueletterbible.org in a new tab when a member clicks a tagged
    reference. Recommended on — it keeps members from losing their place in
    a thread or in the Feed.

hide_translation_abbrev:
  default: false
  description: >-
    Hide the translation abbreviation BLB appends to tagged references in
    the post text (e.g. the trailing "CSB"). Purely cosmetic. NOTE: this
    setting did nothing before 2.0.0 — BLB's script reads a misspelled
    property name internally, and the component was writing the correctly
    spelled one. 2.0.0 writes both, so this now takes effect.

verse_style:
  default: "par"
  type: enum
  choices:
    - par
    - line
  description: >-
    Verse layout inside the popup. 'par' runs verses together as a
    paragraph; 'line' puts each verse on its own line. 'line' reads better
    for long passages, 'par' for single verses.

dark_theme:
  default: "auto"
  type: enum
  choices:
    - auto
    - always
    - never
  description: >-
    Popup colour scheme. 'auto' follows the member's active Discourse
    colour scheme and re-themes on the fly if they switch without
    reloading. NOTE: this setting did nothing before 2.0.0 — BLB's script
    has no dark-theme option whatsoever. 2.0.0 implements it in this
    component's own stylesheet, so it now takes effect.

no_search_tag_names:
  default: "code,pre,textarea"
  description: >-
    HTML tags BLB should never scan, comma-separated. Keeps code samples
    and the composer from having verse references rewritten under the
    member's cursor. Leave blank to let BLB scan everything.

no_search_class_names:
  default: "mention,hashtag,onebox,d-editor-preview,vc-feed-composer"
  description: >-
    CSS class names BLB should never scan, comma-separated. A blocklist
    applied inside the regions named by scan_selectors below. The
    component always appends its own internal guard class to whatever you
    put here, so you cannot switch that protection off by accident.

scan_selectors:
  default: ".cooked, .chat-message-text, .sc-library-card__premise"
  description: >-
    NEW IN 2.0.0, AND THE MOST IMPORTANT SETTING HERE. A comma-separated
    CSS selector list naming the ONLY regions the tagger may rewrite. This
    is an allowlist, and it exists to prevent render corruption. BLB's
    pageInit() walks the entire document body; on this site that includes
    the Ember/Glimmer-rendered navigation, the Feed rails, and AI Space
    conversation titles (which routinely contain live scripture
    references). Rewriting a text node Glimmer owns leaves Glimmer holding
    a reference to a node that no longer exists, which produces the
    removeChild / nextSibling render failures that cost discourse-vc-feed
    three releases. Only ever add selectors that wrap member-authored
    prose. If a surface stops being tagged after an upgrade, add its
    container selector here rather than widening this to something broad
    like "#main-outlet".

script_url:
  default: ""
  description: >-
    ADVANCED — leave blank for normal use. Blank means load ScriptTagger
    from blueletterbible.org, which is what BLB intends and what keeps you
    on their updates. 2.0.0 no longer needs a self-hosted copy to satisfy
    Content-Security-Policy: it unpacks BLB's eval-packed script at
    runtime without ever calling eval. Set this only if you must pin a
    specific copy for some other reason.

debug_logging:
  default: false
  description: >-
    NEW IN 2.0.0. Log what the tagger is doing to the browser console —
    whether the script arrived packed, when it became ready, and how many
    elements each scan tagged. Off by default. Turn on when diagnosing a
    surface that is not being tagged, then turn it back off.

# ── Colours (NEW IN 2.2.0) ─────────────────────────────────────────────
#
# Every default below is exactly the 2.1.0 colour, so installing 2.2.0
# changes nothing until an admin edits one. Values are hex only: #rgb or
# #rrggbb. Anything else (a colour name, a missing #, a typo, blank) is
# ignored and that one colour stays at its default — the stylesheet
# still compiles. Discourse has no colour-picker setting type and no
# pattern validation for string settings, so the check lives in
# common/common.scss.
#
# The defaults MUST stay quoted: an unquoted `#` starts a YAML comment,
# which would turn the default into null.
#
# `dark_theme: auto` takes its popup background, text, muted text and
# border from the member's Discourse colour scheme, so it has no palette
# settings here; only the link colours below apply to it.

popup_header_top_colour:
  default: "#e0812a"
  description: >-
    Hex colour, e.g. #e0812a. Top of the popup's header bar, which fades
    from this colour down to the bottom colour below. Used in light and
    dark mode alike.

popup_header_bottom_colour:
  default: "#c1631a"
  description: >-
    Hex colour, e.g. #c1631a. Bottom of the popup's header bar (see the
    top colour above). Used in light and dark mode alike.

popup_link_colour:
  default: "#b85f14"
  description: >-
    Hex colour, e.g. #b85f14. Links inside the popup (the passage link
    and any others) in light mode.

popup_link_colour_dark:
  default: "#f0a85a"
  description: >-
    Hex colour, e.g. #f0a85a. Links inside the popup in dark mode, for
    both 'auto' on a dark colour scheme and 'always'.

reference_link_colour:
  default: "#d9741d"
  description: >-
    Hex colour, e.g. #d9741d. Tagged scripture references in post text,
    light mode. The underline and hover tint are made from this colour;
    the hover text colour is darkened from it automatically (at the
    default it stays the original #b85f14).

reference_link_colour_dark:
  default: "#f0973f"
  description: >-
    Hex colour, e.g. #f0973f. Tagged scripture references in post text,
    dark mode. The underline and hover tint are made from this colour;
    the hover text colour is lightened from it automatically (at the
    default it stays the original #ffb067).

forced_dark_background:
  default: "#1f1b2e"
  description: >-
    Hex colour, e.g. #1f1b2e. Popup background when dark_theme is
    'always'. Ignored by 'auto', which uses the colour scheme.

forced_dark_credit_background:
  default: "#191528"
  description: >-
    Hex colour, e.g. #191528. Background of the "Powered by Blue Letter
    Bible" strip at the foot of the popup when dark_theme is 'always'.

forced_dark_text_colour:
  default: "#ece9f5"
  description: >-
    Hex colour, e.g. #ece9f5. Verse text in the popup when dark_theme is
    'always'.

forced_dark_muted_colour:
  default: "#b9b2cc"
  description: >-
    Hex colour, e.g. #b9b2cc. Muted text in the popup when dark_theme is
    'always': verse numbers and the "Powered by" credit.

forced_dark_border_colour:
  default: "#3a3350"
  description: >-
    Hex colour, e.g. #3a3350. The popup's outline and the line above the
    "Powered by" credit when dark_theme is 'always'.
